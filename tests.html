<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Тесты — обучение клинингу, ТЦ «Коктал»</title><link rel="stylesheet" href="style.css"></head><body><header><div class="bar"><a class="logo" href="index.html">ТЦ «Коктал» · Обучение</a><nav><a href="index.html">Главная</a><a href="video.html">Видеоуроки</a><a href="standards.html">Стандарты и чек-листы</a><a href="chem.html">Карта химии</a><a href="tests.html" class=on>Тесты</a><a href="audit.html">Для руководства</a></nav></div></header><main><h1>Тесты<span class="kz">Тесттер</span></h1><div class="note"><b>ПРИМЕР.</b> Вопросы ниже — заглушки для проверки работы теста, не учебный материал.</div><form id="qz"></form><button class="btn" id="chk">Проверить</button><p id="res"></p>
<script>
const Q=[{q:"Пример вопроса 1 (заменить)",a:["Вариант А","Вариант Б","Вариант В"],c:0},{q:"Пример вопроса 2 (заменить)",a:["Вариант А","Вариант Б"],c:1}];
const f=document.getElementById('qz');
Q.forEach((x,i)=>{f.insertAdjacentHTML('beforeend','<div class="q card"><b>'+(i+1)+'. '+x.q+'</b>'+x.a.map((a,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+a+'</label>').join('')+'</div>')});
document.getElementById('chk').onclick=()=>{let s=0;Q.forEach((x,i)=>{f.querySelectorAll('[name=q'+i+']').forEach(r=>{r.parentNode.classList.remove('ok','no');if(r.checked){const g=+r.value===x.c;r.parentNode.classList.add(g?'ok':'no');if(g)s++}})});document.getElementById('res').textContent='Правильно: '+s+' из '+Q.length};
</script></main><footer>Черновик · внутренний портал · методика: Adal Works</footer></body></html>
